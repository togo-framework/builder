<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>shell css spike</title>
<link rel="stylesheet" href="/shell.css"></head>
<body class="bg-transparent">
  <!-- ui-desktop's REAL class strings, copied from Window.tsx / Dock.tsx, so
       the spike proves the actual components will render, not a lookalike. -->
  <div id="win" class="fixed left-10 top-10 w-[420px] rounded-xl border border-border bg-card text-card-foreground shadow-2xl overflow-hidden">
    <div class="flex h-10 items-center gap-2 border-b border-border bg-card px-3">
      <span class="text-sm font-medium text-foreground">Window title</span>
      <span class="ms-auto text-xs text-muted-foreground">unfocused</span>
    </div>
    <div class="p-4">
      <p class="text-sm text-muted-foreground">Body text in muted foreground.</p>
      <!-- @property-dependent utilities: transform, ring, shadow. Tailwind v4
           emits document-scoped @property --tw-* registrations for these; if
           those are missing the transform silently does nothing. -->
      <button id="btn" class="mt-3 rounded-md bg-primary px-3 py-1.5 text-sm text-primary-foreground
                              ring-2 ring-ring/40 shadow-lg transition-transform hover:scale-105 scale-110">
        Primary, scaled 110%
      </button>
      <div class="mt-3 rounded bg-destructive/10 p-2 text-xs text-destructive">destructive tint</div>
    </div>
  </div>
  <script>
    document.getElementById('btn').addEventListener('click', () =>
      document.documentElement.classList.toggle('dark'));
  </script>
</body></html>
